<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d2b53">
  <title>Arrow Dance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ANA MENÜ -->
  <section id="home" class="screen active">
    <div id="home-bg"></div>
    <button class="icon-btn top-right" id="btn-settings" aria-label="Ayarlar">⚙</button>
    <div class="home-center">
      <div class="logo-arrows">
        <span class="la la1">➜</span><span class="la la2">➜</span><span class="la la3">➜</span>
      </div>
      <h1 class="title">ARROW<span>DANCE</span></h1>
      <p class="subtitle">Okları sırayla serbest bırak. Çarpışma yok!</p>
      <button class="btn big primary" id="btn-play">
        <span>OYNA</span><small id="play-level">Seviye 1</small>
      </button>
      <div class="btn-row">
        <button class="btn" id="btn-levels">🗺 Seviyeler</button>
        <button class="btn" id="btn-lb">🏆 Liderlik</button>
      </div>
      <div class="home-stats">
        <div><b id="home-stars">0</b><small>⭐ Yıldız</small></div>
        <div><b id="home-score">0</b><small>Puan</small></div>
        <div><b id="home-hints">3</b><small>💡 İpucu</small></div>
      </div>
    </div>
    <div class="player-tag" id="player-tag"></div>
  </section>

  <!-- SEVİYE SEÇİMİ -->
  <section id="levels" class="screen">
    <header class="bar">
      <button class="icon-btn" data-back aria-label="Geri">‹</button>
      <h2>Seviyeler</h2>
      <span class="bar-right" id="levels-stars"></span>
    </header>
    <div class="scroll" id="chapter-list"></div>
  </section>

  <!-- OYUN -->
  <section id="game" class="screen">
    <header class="bar hud">
      <button class="icon-btn" data-back aria-label="Geri">‹</button>
      <div class="hud-title">
        <small id="hud-chapter">Başlangıç</small>
        <b id="hud-level">Seviye 1</b>
      </div>
      <div class="hearts" id="hud-hearts"></div>
    </header>
    <div class="hud-sub">
      <span id="hud-time">0:00</span>
      <div class="progress"><i id="hud-progress"></i></div>
      <span id="hud-left">0</span>
    </div>
    <div id="board-wrap">
      <canvas id="board"></canvas>
      <div id="tutorial" class="hidden"><div class="hand">👆</div><p id="tutorial-text"></p></div>
    </div>
    <footer class="hud-bottom">
      <button class="btn round" id="btn-restart" aria-label="Yeniden">↻</button>
      <div class="zoom">
        <button class="btn zbtn" id="btn-zoom-out" aria-label="Uzaklaştır">−</button>
        <button class="btn zbtn" id="btn-zoom-fit" aria-label="Sığdır">⤢</button>
        <button class="btn zbtn" id="btn-zoom-in" aria-label="Yakınlaştır">+</button>
      </div>
      <button class="btn round hint" id="btn-hint" aria-label="İpucu">💡<span id="hint-count">3</span></button>
    </footer>
  </section>

  <!-- LİDERLİK -->
  <section id="leaderboard" class="screen">
    <header class="bar">
      <button class="icon-btn" data-back aria-label="Geri">‹</button>
      <h2>Küresel Liderlik</h2>
      <button class="icon-btn" id="btn-lb-refresh" aria-label="Yenile">↻</button>
    </header>
    <div class="me-card" id="lb-me"></div>
    <div class="scroll" id="lb-list"></div>
  </section>

  <div id="modal" class="modal hidden"><div class="card" id="modal-card"></div></div>
  <div id="toast"></div>
</div>

<script src="config.js"></script>
<script src="levels.js"></script>
<script src="leaderboard.js"></script>
<script src="game.js"></script>
</body>
</html>
