plugins {
    id 'com.android.application'
}

def vCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def vName = (project.findProperty('versionName') ?: '1.0.0').toString()

android {
    namespace 'com.burak.arrowdance'
    compileSdk 34

    defaultConfig {
        applicationId "com.burak.arrowdance"
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        release {
            // GitHub secrets tanımlıysa imzalı sürüm APK'sı üretilir
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks && file(ks).exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
