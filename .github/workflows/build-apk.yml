name: APK Derle

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seviyeleri test et
        run: node test/levels.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Liderlik tablosu adresini ekle
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          if [ -n "$FIREBASE_DB_URL" ]; then
            sed -i "s|firebaseDbUrl: \"\"|firebaseDbUrl: \"${FIREBASE_DB_URL}\"|" app/src/main/assets/www/config.js
            echo "Firebase adresi eklendi."
          else
            echo "FIREBASE_DB_URL tanımlı değil — liderlik tablosu kapalı derlenecek."
          fi

      - name: İmza anahtarını hazırla (isteğe bağlı)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TASKS=":app:assembleDebug"
          if [ -n "$KEYSTORE_FILE" ]; then TASKS="$TASKS :app:assembleRelease"; fi
          gradle $TASKS --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      - name: APK dosyalarını adlandır
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ArrowDance-v1.0.${{ github.run_number }}-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/ArrowDance-v1.0.${{ github.run_number }}.apk
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ArrowDance-APK
          path: out/*.apk

      - name: Sürüm yayınla (etiketlerde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
